openapi: 3.0.1

info:
  title: Google Ads Analytics
  version: 1.0.0
  description: Analyse et optimisation Google Ads

servers:
  - url: https://google-ads-mcp-165964728033.europe-west1.run.app

paths:

  /health:
    get:
      operationId: Health
      summary: API Health Check
      responses:
        "200":
          description: OK

  /accounts:
    get:
      operationId: Accounts
      summary: List Google Ads Accounts
      responses:
        "200":
          description: Success
          
  /add-keyword:
    post:
      operationId: AddKeyword
      summary: Add Keyword
      responses:
        "200":
          description: Success

  /add-negative-keyword:
    post:
      operationId: AddNegativeKeyword
      summary: Add Negative Keyword
      responses:
        "200":
          description: Success

  /remove-negative-keyword:
    post:
      operationId: RemoveNegativeKeyword
      summary: Remove Negative Keyword
      responses:
        "200":
          description: Success

  /pause-campaign:
    post:
      operationId: PauseCampaign
      summary: Pause Campaign
      responses:
        "200":
          description: Success
          
  /enable-campaign:
    post:
      operationId: EnableCampaign
      summary: Enable Campaign
      responses:
        "200":
          description: Success
          
  /pause-ad-group:
    post:
      operationId: PauseAdGroup
      summary: Pause Ad Group
      responses:
        "200":
          description: Success
          
  /enable-ad-group:
    post:
      operationId: EnableAdGroup
      summary: Enable Ad Group
      responses:
        "200":
          description: Success
          
  /update-budget:
