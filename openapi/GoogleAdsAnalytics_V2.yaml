openapi: 3.0.1

info:
  title: GoogleAdsAnalytics_V2
  version: 2.0.0

servers:
  - url: https://google-ads-mcp-165964728033.europe-west1.run.app

paths:

  /accounts:
    get:
      operationId: Accounts
      summary: Accounts

      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Success
          
  /account-search:
    get:
      operationId: AccountSearch
      summary: Account Search

      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string

        - name: status
          in: query
          required: false
          schema:
            type: string

      responses:
        "200":
          description: Success

  /campaign-performance:
     get:
       operationId: CampaignPerformance
       summary: Campaign Performance

       parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string

        - name: period
          in: query
          required: false
          schema:
          type: string
            default: LAST_30_DAYS

        - name: start_date
          in: query
          required: false
          schema:
            type: string

        - name: end_date
          in: query
          required: false
          schema:
            type: string

      responses:
        "200":
           description: Successs
